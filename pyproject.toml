[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "syris"
dynamic = ["version"]
description = "X-ray imaging simulation"
readme = "README.rst"
requires-python = ">=3.10"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Tomas Farago", email = "tomas.farago@kit.edu"}]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "quantities>=0.16",
    "pyopencl>=2024.3",
    "reikna>=0.9",
    "matplotlib>=3.8",
    "pyvista>=0.46.3",
]

[project.urls]
Homepage = "https://github.com/ufo-kit/syris"
Documentation = "https://syris.readthedocs.io/"

[project.optional-dependencies]
cuda12 = ["cupy-cuda12x>=13.6"]
cuda13 = ["cupy-cuda13x>=14"]
mesh-repair = ["libigl>=2.6.3,<3"]
examples = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "imageio>=2.34",
    "tqdm>=4.66",
    "graphviz>=0.20",
]

[dependency-groups]
dev = ["pytest>=8.3", "coverage[toml]>=7.6", "ruff>=0.14", "twine>=6.1"]
docs = ["sphinx>=7.4"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "syris.__version__"}

[tool.setuptools.packages.find]
include = ["syris", "syris.*"]
exclude = ["syris.tests", "syris.tests.*"]
namespaces = false

[tool.setuptools.package-data]
syris = ["gpu/opencl/*.cl", "gpu/opencl/*.in", "gpu/cuda/*.cu", "gpu/cuda/*.cuh"]
"syris.devices" = ["data/*.npy"]

[tool.pytest.ini_options]
testpaths = ["syris/tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# The formatter handles wrapping; long comments and strings may remain longer.
ignore = ["E501"]

[tool.coverage.run]
source = ["syris"]
omit = ["syris/tests/*"]

[tool.uv]
conflicts = [[{extra = "cuda12"}, {extra = "cuda13"}]]
